{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
  <article class="prose-page measure">
    <header class="page-heading">
      <p class="eyebrow">The poet</p>
      <h1>{{ page.title }}</h1>
    </header>
    {% if page.body %}
      <div class="rich-text prose">{{ page.body|richtext }}</div>
    {% else %}
      <div class="empty-state"><p>A note about the poet will appear here.</p></div>
    {% endif %}
  </article>
{% endblock %}
