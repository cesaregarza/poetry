{% if items.paginator.num_pages > 1 %}
  <nav class="pagination" aria-label="Pagination">
    {% if items.has_previous %}<a href="{% querystring page=items.previous_page_number %}" rel="prev"><span aria-hidden="true">←</span> Previous</a>{% else %}<span></span>{% endif %}
    <span>Page {{ items.number }} of {{ items.paginator.num_pages }}</span>
    {% if items.has_next %}<a href="{% querystring page=items.next_page_number %}" rel="next">Next <span aria-hidden="true">→</span></a>{% else %}<span></span>{% endif %}
  </nav>
{% endif %}
